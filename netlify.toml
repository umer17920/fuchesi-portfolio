# Netlify build configuration.
#
# The Next.js Runtime (v5) is what turns a `next build` into something Netlify
# can actually serve: it moves the prerendered pages and static assets into the
# CDN layout, wraps the server in a function (for /api/* and /studio), and wires
# up ISR and next/image.
#
# It is declared EXPLICITLY below rather than relying on Netlify's automatic
# framework detection. Auto-install did not happen on this site — builds
# succeeded but published the raw `.next` directory as flat static files, so
# `/` had no index.html and every route hit Netlify's own 404 page (the
# giveaway: /BUILD_ID and /server/app/index.html were fetchable). Declaring the
# plugin here and pinning it in devDependencies makes the runtime a build
# input we control instead of something we hope Netlify infers.

[build]
  command = "npm run build"
  # Required by the Next.js Runtime v5: it reads the Next build output from
  # `.next` and rewrites it into the deployable layout during onBuild.
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
