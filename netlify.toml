# Netlify build configuration.
#
# The Next.js Runtime (v5) is what turns a `next build` into something Netlify
# can actually serve: it moves the prerendered pages and static assets into the
# CDN layout, wraps the server in a function (for /api/* and /studio), and wires
# up ISR and next/image.
#
# It is declared EXPLICITLY below rather than relying on Netlify's automatic
# framework detection. Auto-install did not happen on this site — builds
# succeeded but published the raw `.next` directory as flat static files, so
# `/` had no index.html and every route hit Netlify's own 404 page (the
# giveaway: /BUILD_ID and /server/app/index.html were fetchable). Declaring the
# plugin here and pinning it in devDependencies makes the runtime a build
# input we control instead of something we hope Netlify infers.

[build]
  command = "npm run build"
  # Required by the Next.js Runtime v5: it reads the Next build output from
  # `.next` and rewrites it into the deployable layout during onBuild.
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

  # Netlify fails a build if the VALUE of any environment variable also appears
  # in the build output. That is the right default for a private key, but three
  # of this site's values are ordinary words that are guaranteed to appear:
  #
  #   GOOGLE_SHEET_TAB              "Submissions" is the hardcoded fallback in
  #                                 lib/sheets.ts
  #   NEXT_PUBLIC_SANITY_DATASET    "production" appears all over any Next build
  #   NEXT_PUBLIC_SANITY_API_VERSION  the date string is a default in
  #                                 lib/sanity/env.ts
  #   NEXT_PUBLIC_SANITY_PROJECT_ID NEXT_PUBLIC_ values are inlined into the
  #                                 client bundle by design — they are public
  #
  # None of these are secrets: a tab name, a dataset name, a version date and a
  # public project id. Omitting them keeps scanning ON for everything that
  # actually matters — the private key, the Resend key, the Sanity write token
  # and the revalidate secret are all still scanned.
  #
  # CONTACT_TO and CONTACT_FROM are added for the same reason, ahead of Resend
  # being wired up. CONTACT_TO is almost always contact@fuchesi.com, and that
  # exact string is printed in the footer, on the contact page and in llms.txt,
  # so scanning it would fail every build the moment the variable is set.
  # An address the site already publishes is not a secret.
  #
  # RESEND_API_KEY is deliberately NOT omitted. It is a real credential, it
  # never appears in build output, and it should keep being scanned.
  SECRETS_SCAN_OMIT_KEYS = "GOOGLE_SHEET_TAB,NEXT_PUBLIC_SANITY_DATASET,NEXT_PUBLIC_SANITY_API_VERSION,NEXT_PUBLIC_SANITY_PROJECT_ID,CONTACT_TO,CONTACT_FROM"

[[plugins]]
  package = "@netlify/plugin-nextjs"
